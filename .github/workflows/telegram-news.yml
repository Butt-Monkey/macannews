name: Обновление ленты Telegram

# Читает новые посты канала через официальный Bot API Telegram
# (api.telegram.org) — предыдущий способ (чтение t.me/s/<канал> напрямую)
# упёрся в устойчивую DNS-блокировку домена t.me именно с сети GitHub Actions.
# Бот должен быть администратором канала, токен лежит в секрете TG_BOT_TOKEN
# (Settings → Secrets and variables → Actions).
#
# Про расписание: GitHub не гарантирует, что cron сработает вовремя — при
# нагрузке запуски «*/15» приходят раз в 2–5 часов (замерено: средний
# интервал ~134 мин, максимум 12 часов). Поэтому:
#  - расписание разложено по НЕкруглым минутам (круглые — самые загруженные);
#  - вокруг 8:07 и 20:07 МСК (05:07 и 17:07 UTC) стоит несколько запусков
#    подряд — хватит, чтобы хотя бы один дошёл;
#  - прогон, стартовавший в «золотом окне», сам ждёт появления свежего поста
#    (см. fetch-news.mjs), а не уходит сразу.
# Время в cron — UTC (МСК = UTC+3, без перехода на летнее время).

on:
  schedule:
    # золотые окна: 07:52, 08:04, 08:19, 08:34 МСК и 19:52, 20:04, 20:19, 20:34 МСК
    - cron: '52 4,16 * * *'
    - cron: '4,19,34 5,17 * * *'
    # остальное время — каждые 30 минут
    - cron: '12,42 * * * *'
  workflow_dispatch:
    inputs:
      refetch:
        description: 'Перезагрузить посты по номеру (через запятую), например 301 или 301,302. Обычно пусто.'
        required: false
        default: ''

permissions:
  contents: write

# запуски не должны идти одновременно: они пишут в один и тот же news.json
concurrency:
  group: telegram-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # копия ленты ДО обновления — по ней последний шаг поймёт, какие посты новые
      - name: Запомнить ленту до обновления
        run: cp news.json "$RUNNER_TEMP/news-before.json" 2>/dev/null || echo '[]' > "$RUNNER_TEMP/news-before.json"

      - name: Собрать news.json через Bot API
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          REFETCH_IDS: ${{ github.event.inputs.refetch }}
        run: node .github/scripts/fetch-news.mjs

      # отдельные страницы постов macannews.ru/n/<номер>/ (превью в соцсетях + поиск).
      # Если шаг упадёт — лента всё равно закоммитится (continue-on-error)
      - name: Страницы постов для соцсетей и поиска
        continue-on-error: true
        run: node .github/scripts/build-news-pages.mjs

      - name: Закоммитить, если лента изменилась
        run: |
          if [ -n "$(git status --porcelain -- news.json assets/news .github/state n sitemap-news.xml)" ]; then
            git config user.name "87-news-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -A news.json assets/news .github/state
            # страницы постов — только если есть (или были) в репозитории: если шаг
            # сборки страниц упал в самый первый раз, git add по пустому пути не должен
            # ронять коммит ленты
            for p in n sitemap-news.xml; do
              if [ -e "$p" ] || git ls-files --error-unmatch "$p" >/dev/null 2>&1; then git add -A "$p"; fi
            done
            git commit -m "auto: обновление ленты Telegram"
            # пока шёл прогон, в main мог попасть чужой коммит (например, зип с сайтом)
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              sleep 5
            done
            [ "$pushed" = 1 ] || { echo "Не удалось запушить после 3 попыток"; exit 1; }
          else
            echo "Без изменений — новых постов нет"
          fi

      # НЕОБЯЗАТЕЛЬНО: новые посты канала — ещё и в Discord (канал «новости-87»).
      # Включается секретом DISCORD_NEWS_WEBHOOK (вебхук канала в Discord); нет
      # секрета — шаг молча пропускается. Шлём только посты не старше 2 суток,
      # чтобы добор старых постов в ленту не устроил спам. Картинку берём с
      # raw.githubusercontent.com — она доступна сразу после коммита, а
      # macannews.ru обновляется через минуту-две.
      - name: Новости → Discord
        if: ${{ always() }}
        continue-on-error: true
        env:
          HOOK: ${{ secrets.DISCORD_NEWS_WEBHOOK }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          if [ -z "${HOOK:-}" ]; then echo "DISCORD_NEWS_WEBHOOK не задан — пропускаю"; exit 0; fi
          before="$RUNNER_TEMP/news-before.json"
          jq -c --slurpfile old "$before" '
            ($old[0] | map(.id)) as $was
            | [ .[] | select((.id as $i | $was | index($i)) | not)
                    | select(((.date // "") | sub("[.][0-9]+Z$"; "Z") | try fromdateiso8601 catch 0) > (now - 172800)) ]
            | reverse | .[]' news.json > new.jsonl || true
          n=$(wc -l < new.jsonl | tr -d ' ')
          echo "Новых постов для Discord: $n"
          while IFS= read -r post; do
            [ -z "$post" ] && continue
            echo "$post" | jq -c --arg repo "$REPO" '
              (.text // "" | split("\n") | map(gsub("^[[:space:]⚡❗]+"; "") | select(test("[^[:space:]]")))) as $lines
              | ($lines[0] // "Новость 87") as $title
              | ($lines[1:] | join("\n")) as $body
              | (if .page then "https://macannews.ru/" + .page else "https://macannews.ru/#news/" + .id end) as $url
              | { username: "87 · Macan News",
                  allowed_mentions: { parse: [] },
                  embeds: [ {
                    title: ($title | .[0:250]),
                    url: $url,
                    description: ((if ($body | length) > 600 then $body[0:600] + "…" else $body end) + "\n\n[Читать на сайте](" + $url + ")"),
                    color: 16622786,
                    timestamp: .date,
                    footer: { text: "87 · Macan News · macannews.ru" }
                  } + (if .image then { image: { url: ("https://raw.githubusercontent.com/" + $repo + "/main/" + .image) } } else {} end) ] }' > msg.json
            code=$(curl -sS -o res.txt -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data-binary @msg.json "$HOOK?wait=true" || echo 000)
            echo "Discord: $code"
            sleep 2
          done < new.jsonl
